# Kodi 7.1 (ALSA order FL FR BL BR FC LFE SL SR) -> one filter per speaker and ear -> 2 ch HDMI.
# Copy to /storage/.config/binaural/camilladsp.yml. As shipped each filter is one tap, a plain
# downmix; put the measured responses in /storage/.config/binaural/filters/<spk>_<ear>.raw
# (f32 little-endian, 48 kHz) and switch each filter to the commented Raw form.
devices:
  samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  enable_rate_adjust: true
  target_level: 2048
  adjust_period: 10
  capture:
    type: Alsa
    channels: 8
    device: "hw:Loopback,1,0"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    # HDMI PCM is device 3 (TDM-B); device 0 carries passthrough only
    device: "plughw:AMLAUGESOUND,3"
    format: S32_LE
filters:
  FL_L:
    type: Conv
    parameters:
      type: Values
      values: [0.5]
      # type: Raw
      # filename: /storage/.config/binaural/filters/FL_L.raw
      # format: F32_LE
  FL_R:
    type: Conv
    parameters:
      type: Values
      values: [0]
      # type: Raw
      # filename: /storage/.config/binaural/filters/FL_R.raw
      # format: F32_LE
  FR_L:
    type: Conv
    parameters:
      type: Values
      values: [0]
      # type: Raw
      # filename: /storage/.config/binaural/filters/FR_L.raw
      # format: F32_LE
  FR_R:
    type: Conv
    parameters:
      type: Values
      values: [0.5]
      # type: Raw
      # filename: /storage/.config/binaural/filters/FR_R.raw
      # format: F32_LE
  BL_L:
    type: Conv
    parameters:
      type: Values
      values: [0.354]
      # type: Raw
      # filename: /storage/.config/binaural/filters/BL_L.raw
      # format: F32_LE
  BL_R:
    type: Conv
    parameters:
      type: Values
      values: [0]
      # type: Raw
      # filename: /storage/.config/binaural/filters/BL_R.raw
      # format: F32_LE
  BR_L:
    type: Conv
    parameters:
      type: Values
      values: [0]
      # type: Raw
      # filename: /storage/.config/binaural/filters/BR_L.raw
      # format: F32_LE
  BR_R:
    type: Conv
    parameters:
      type: Values
      values: [0.354]
      # type: Raw
      # filename: /storage/.config/binaural/filters/BR_R.raw
      # format: F32_LE
  FC_L:
    type: Conv
    parameters:
      type: Values
      values: [0.354]
      # type: Raw
      # filename: /storage/.config/binaural/filters/FC_L.raw
      # format: F32_LE
  FC_R:
    type: Conv
    parameters:
      type: Values
      values: [0.354]
      # type: Raw
      # filename: /storage/.config/binaural/filters/FC_R.raw
      # format: F32_LE
  LFE_L:
    type: Conv
    parameters:
      type: Values
      values: [0.25]
      # type: Raw
      # filename: /storage/.config/binaural/filters/LFE_L.raw
      # format: F32_LE
  LFE_R:
    type: Conv
    parameters:
      type: Values
      values: [0.25]
      # type: Raw
      # filename: /storage/.config/binaural/filters/LFE_R.raw
      # format: F32_LE
  SL_L:
    type: Conv
    parameters:
      type: Values
      values: [0.354]
      # type: Raw
      # filename: /storage/.config/binaural/filters/SL_L.raw
      # format: F32_LE
  SL_R:
    type: Conv
    parameters:
      type: Values
      values: [0]
      # type: Raw
      # filename: /storage/.config/binaural/filters/SL_R.raw
      # format: F32_LE
  SR_L:
    type: Conv
    parameters:
      type: Values
      values: [0]
      # type: Raw
      # filename: /storage/.config/binaural/filters/SR_L.raw
      # format: F32_LE
  SR_R:
    type: Conv
    parameters:
      type: Values
      values: [0.354]
      # type: Raw
      # filename: /storage/.config/binaural/filters/SR_R.raw
      # format: F32_LE
mixers:
  split:
    channels:
      in: 8
      out: 16
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0
      - dest: 1
        sources:
          - channel: 0
            gain: 0
      - dest: 2
        sources:
          - channel: 1
            gain: 0
      - dest: 3
        sources:
          - channel: 1
            gain: 0
      - dest: 4
        sources:
          - channel: 2
            gain: 0
      - dest: 5
        sources:
          - channel: 2
            gain: 0
      - dest: 6
        sources:
          - channel: 3
            gain: 0
      - dest: 7
        sources:
          - channel: 3
            gain: 0
      - dest: 8
        sources:
          - channel: 4
            gain: 0
      - dest: 9
        sources:
          - channel: 4
            gain: 0
      - dest: 10
        sources:
          - channel: 5
            gain: 0
      - dest: 11
        sources:
          - channel: 5
            gain: 0
      - dest: 12
        sources:
          - channel: 6
            gain: 0
      - dest: 13
        sources:
          - channel: 6
            gain: 0
      - dest: 14
        sources:
          - channel: 7
            gain: 0
      - dest: 15
        sources:
          - channel: 7
            gain: 0
  sum:
    channels:
      in: 16
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0
          - channel: 2
            gain: 0
          - channel: 4
            gain: 0
          - channel: 6
            gain: 0
          - channel: 8
            gain: 0
          - channel: 10
            gain: 0
          - channel: 12
            gain: 0
          - channel: 14
            gain: 0
      - dest: 1
        sources:
          - channel: 1
            gain: 0
          - channel: 3
            gain: 0
          - channel: 5
            gain: 0
          - channel: 7
            gain: 0
          - channel: 9
            gain: 0
          - channel: 11
            gain: 0
          - channel: 13
            gain: 0
          - channel: 15
            gain: 0
pipeline:
  - type: Mixer
    name: split
  - type: Filter
    channels: [0]
    names: [FL_L]
  - type: Filter
    channels: [1]
    names: [FL_R]
  - type: Filter
    channels: [2]
    names: [FR_L]
  - type: Filter
    channels: [3]
    names: [FR_R]
  - type: Filter
    channels: [4]
    names: [BL_L]
  - type: Filter
    channels: [5]
    names: [BL_R]
  - type: Filter
    channels: [6]
    names: [BR_L]
  - type: Filter
    channels: [7]
    names: [BR_R]
  - type: Filter
    channels: [8]
    names: [FC_L]
  - type: Filter
    channels: [9]
    names: [FC_R]
  - type: Filter
    channels: [10]
    names: [LFE_L]
  - type: Filter
    channels: [11]
    names: [LFE_R]
  - type: Filter
    channels: [12]
    names: [SL_L]
  - type: Filter
    channels: [13]
    names: [SL_R]
  - type: Filter
    channels: [14]
    names: [SR_L]
  - type: Filter
    channels: [15]
    names: [SR_R]
  - type: Mixer
    name: sum
