# YACER upstream watch
#
# coreelec-22 is an exact mirror of CoreELEC/CoreELEC. Nothing of ours lives
# there, so upstream force-pushing or rewriting history costs us nothing - the
# mirror simply moves to wherever they are now.
#
# Our builds do not follow the mirror. They build the CoreELEC commit named in
# coreelec.pin on the yacer branch, and that pin moves only once our patches are
# known to work on the new upstream: every stack applies and the native tests
# pass. Until then a build of ours keeps using the last CoreELEC that worked,
# instead of failing because upstream moved under it. Nothing is built here: a
# compile break shows in the next build, local or started by hand.
#
#   watch     mirror upstream; is its tip a new candidate for the pin?
#   apply     lay our files over the candidate and apply every package's
#             patch stack to its pinned source - minutes, not hours
#   tests     the native tests against the candidate (yacer-tests.yml)
#   pin       both passed: commit the pin move to yacer
#
# A failure anywhere leaves the pin where it is; the next watch tries again.
name: YACER upstream sync

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Validate this CoreELEC commit instead of the upstream tip'
        type: string
        default: ''

concurrency:
  group: yacer-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    name: mirror upstream
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.sync.outputs.candidate }}
      yacer: ${{ steps.sync.outputs.yacer }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: yacer
          fetch-depth: 1

      - name: Sync
        id: sync
        env:
          GIVEN: ${{ inputs.candidate || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/CoreELEC/CoreELEC || true
          git fetch --depth=1 upstream coreelec-22
          git fetch --depth=1 origin coreelec-22:refs/remotes/origin/coreelec-22 || true

          NEW=$(git rev-parse upstream/coreelec-22)
          # --verify --quiet prints nothing when the ref is missing; plain
          # rev-parse echoes the name itself, which is not a sha and not empty
          OLD=$(git rev-parse --verify --quiet origin/coreelec-22^{commit} || true)
          if [ "$NEW" = "$OLD" ]; then
            echo "mirror already at ${NEW:0:10}"
          else
            git push --force origin "$NEW":refs/heads/coreelec-22
            echo "mirror ${OLD:0:10} -> ${NEW:0:10}"
          fi

          PIN=$(tr -d '[:space:]' < coreelec.pin)
          CAND=${GIVEN:-$NEW}
          case "$CAND" in
            ????????????????????????????????????????) ;;
            *) echo "::error::candidate must be a full commit sha"; exit 1 ;;
          esac
          echo "yacer=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$CAND" = "$PIN" ]; then
            echo "pin already at ${PIN:0:10} - nothing to validate"
            exit 0
          fi

          # The candidate must be in this repository for the later checkouts, and
          # must stay there: the mirror moves on tomorrow, and a build chain can
          # outlive a day.
          git cat-file -e "$CAND^{commit}" 2>/dev/null || git fetch --depth=1 origin "$CAND" \
            || git fetch --depth=1 upstream "$CAND" \
            || { echo "::error::${CAND:0:10} is neither here nor upstream"; exit 1; }
          git push origin "$CAND":refs/tags/coreelec-candidate/"$CAND" 2>/dev/null \
            || git ls-remote --exit-code origin refs/tags/coreelec-candidate/"$CAND" >/dev/null \
            || { echo "::error::could not keep ${CAND:0:10} under a tag"; exit 1; }
          echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          echo "pin ${PIN:0:10}, candidate ${CAND:0:10}" | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply our patches
    needs: watch
    if: needs.watch.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.watch.outputs.yacer }}
          path: CoreELEC-yacer
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.watch.outputs.candidate }}
          path: CoreELEC
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every package's stack against the source its package.mk pins, the way
      # scripts/unpack applies it: zero fuzz for ours. Names every stack that
      # breaks, where a build stops at the first.
      - name: Apply every patch stack
        working-directory: CoreELEC
        run: python3 ../CoreELEC-yacer/tests/check-patch-stack.py

      # The overlay and the tree-patches, exactly as the build lays them.
      - name: Assemble our files onto the candidate
        working-directory: CoreELEC
        run: bash ../CoreELEC-yacer/scripts/yacer-assemble.sh ../CoreELEC-yacer

  tests:
    name: native tests
    needs: watch
    if: needs.watch.outputs.candidate != ''
    uses: ./.github/workflows/yacer-tests.yml
    with:
      mirror: ${{ needs.watch.outputs.candidate }}
      yacer: ${{ needs.watch.outputs.yacer }}

  pin:
    name: move the pin
    needs: [watch, apply, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Commit the pin move to yacer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CE_SHA: ${{ needs.watch.outputs.candidate }}
          YA_SHA: ${{ needs.watch.outputs.yacer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          subject=$(gh api "repos/$REPO/commits/$CE_SHA" --jq '.commit.message | split("\n")[0]')
          blob=$(gh api "repos/$REPO/git/blobs" -f content="$CE_SHA"$'\n' -f encoding=utf-8 --jq .sha)
          base=$(gh api "repos/$REPO/git/commits/$YA_SHA" --jq .tree.sha)
          tree=$(jq -n --arg base "$base" --arg blob "$blob" \
                   '{base_tree: $base, tree: [{path: "coreelec.pin", mode: "100644", type: "blob", sha: $blob}]}' \
                 | gh api "repos/$REPO/git/trees" --input - --jq .sha)
          msg=$(printf 'ci: move the CoreELEC pin to %s\n\n%s\n\nPatch stacks and native tests checked against yacer %s:\n%s\n' \
                  "${CE_SHA:0:10}" "$subject" "${YA_SHA:0:10}" "$RUN_URL")
          commit=$(jq -n --arg msg "$msg" --arg tree "$tree" --arg parent "$YA_SHA" \
                     '{message: $msg, tree: $tree, parents: [$parent]}' \
                   | gh api "repos/$REPO/git/commits" --input - --jq .sha)
          # the tag first: a pin must never name a commit nothing keeps
          if ! gh api "repos/$REPO/git/ref/tags/coreelec-pin/$CE_SHA" >/dev/null 2>&1; then
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/coreelec-pin/$CE_SHA" -f sha="$CE_SHA" >/dev/null \
              || { echo "::error::could not tag ${CE_SHA:0:10} - the pin stays"; exit 1; }
          fi
          if ! gh api -X PATCH "repos/$REPO/git/refs/heads/yacer" -f sha="$commit" -F force=false >/dev/null; then
            tip=$(gh api "repos/$REPO/git/ref/heads/yacer" --jq .object.sha 2>/dev/null || true)
            if [ -n "$tip" ] && [ "$tip" != "$YA_SHA" ]; then
              echo "::error::yacer moved to ${tip:0:10} during this check of ${YA_SHA:0:10} - the pin"
              echo "         stays, and the next watch checks the new yacer instead"
            else
              echo "::error::GitHub refused to move yacer to the pin commit (protection or a ruleset?)"
            fi
            exit 1
          fi
          # the pin tag keeps it now
          gh api -X DELETE "repos/$REPO/git/refs/tags/coreelec-candidate/$CE_SHA" >/dev/null 2>&1 || true
          # the change list names the pinned commit; a push by this token starts
          # no run of its own
          gh workflow run yacer-docs.yml --repo "$REPO" --ref yacer \
            || echo "::warning::could not refresh the change list page"
          echo "pin moved to ${CE_SHA:0:10} in yacer ${commit:0:10}" | tee -a "$GITHUB_STEP_SUMMARY"
