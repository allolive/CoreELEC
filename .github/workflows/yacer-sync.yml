# YACER upstream sync
#
# coreelec-22 is an exact mirror of CoreELEC/CoreELEC. Nothing of ours lives
# there, so upstream force-pushing or rewriting history costs us nothing - the
# mirror simply moves to wherever they are now.
#
# Our own files live on the yacer branch, which shares no history with the
# mirror and is never replayed onto it. The build copies them over a checkout
# of the mirror instead, so an upstream rewrite can never conflict with us.
#
# The one exception is kodi: our kodi patches live as commits on allolive/xbmc
# yacer-kodi and are rebased with git onto each new kodi pin before the mirror
# moves. If they do not fit, the mirror stays where it is and this run fails
# with the report in the job summary.
name: YACER upstream sync

on:
  schedule:
    - cron: '17 5 * * *'        # daily; every sync that lands changes starts a build
  workflow_dispatch:
  push:
    branches: [ yacer ]
    paths:
      - 'overlay/projects/Amlogic-ce/patches-yacer/kodi/**'

concurrency:
  group: yacer-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: mirror upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: yacer-push
    steps:
      - uses: actions/checkout@v7
        with:
          ref: yacer
          fetch-depth: 1
          persist-credentials: false

      # everything that decides what to push; no secret and no credentials here
      - name: Plan
        id: plan
        run: bash scripts/yacer-kodi.sh plan > "$RUNNER_TEMP/plan"

      - name: Push
        id: push
        if: steps.plan.outcome == 'success'
        env:
          XBMC_DEPLOY_KEY: ${{ secrets.XBMC_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/yacer-kodi.sh push "$RUNNER_TEMP/plan"

      - name: Trigger a build
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run yacer-build.yml --repo "${{ github.repository }}" --ref yacer

      - name: Result
        if: always()
        run: |
          cat "$RUNNER_TEMP/plan" 2>/dev/null || true
          grep -qx 'result=ok' "$RUNNER_TEMP/plan"
